name: Guard Waltiva Media V8
on:
  push:
    paths:
      - '.github/workflows/guard-media-v8.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Skip full-page raster scans
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('media-v8.js');s=p.read_text(encoding='utf-8')
          old="if(box.width<8||box.height<8||box.width*box.height<180)continue;"
          new="const pageH=parseFloat(pageEl.dataset.pdfHeight)||pageEl.offsetHeight;if(box.width<8||box.height<8||box.width*box.height<180||box.width*box.height>pageW*pageH*.78)continue;"
          if old in s:s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-v8.js
          git diff --cached --quiet || git commit -m "Avoid treating scanned PDF pages as movable images"
          git push