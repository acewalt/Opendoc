name: Wire Waltiva Fidelity V6

on:
  push:
    branches: [main]
    paths:
      - 'pdf-fidelity-v6.js'
      - '.github/workflows/wire-fidelity-v6.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect V6 fidelity script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="./pdf-fidelity-v6.js"></script>\n'
          if tag not in s:
              anchor = '  <script src="./docx-fidelity-v5.js"></script>\n'
              if anchor in s:
                  s = s.replace(anchor, anchor + tag)
              else:
                  s = s.replace('</body>', tag + '</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "Already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable robust PDF visual fidelity V6"
          git push
