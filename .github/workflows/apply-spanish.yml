name: Diagnosticar aplicación del locale compilado

on:
  push:
    paths:
      - '.github/workflows/apply-spanish.yml'

permissions:
  contents: read

jobs:
  inspect-locale-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar flujo de carga y aplicación del diccionario
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for editor in ('documenteditor', 'spreadsheeteditor', 'presentationeditor'):
              text = Path(f'public/web-apps/apps/{editor}/main/app.js').read_text(encoding='utf-8')
              print(f'\n===== {editor} =====')

              req = f'require(["{editor}/main/locale/zh.json"'
              pos = text.find(req)
              print('--- bootstrap require y callback ---')
              print(text[pos:pos+5000] if pos >= 0 else 'NO ENCONTRADO')

              marker = 'Common.Locale=new function()'
              pos2 = text.find(marker)
              print('\n--- Common.Locale compilado ---')
              print(text[pos2:pos2+6500] if pos2 >= 0 else 'NO ENCONTRADO')

              for needle in ('Common.Locale.apply(', '.apply(null,t)', '.apply(null, t)', 'locale.apply(', 'Locale.apply('):
                  positions = [m.start() for m in re.finditer(re.escape(needle), text)]
                  if positions:
                      print(f'\n{needle}: {positions}')
                      for p in positions[:10]:
                          print(text[max(0,p-500):p+1000])
          PY
