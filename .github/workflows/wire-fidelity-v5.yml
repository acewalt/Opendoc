name: Wire Waltiva Fidelity V5
on:
  push:
    paths:
      - fidelity-v5.css
      - pdf-fidelity-v5.js
      - docx-fidelity-v5.js
      - .github/workflows/wire-fidelity-v5.yml
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect fidelity assets
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '  <link rel="stylesheet" href="./fidelity-v5.css" />\n'
          js1 = '  <script src="./pdf-fidelity-v5.js"></script>\n'
          js2 = '  <script src="./docx-fidelity-v5.js"></script>\n'
          if 'fidelity-v5.css' not in s:
              s = s.replace('</head>', css + '</head>')
          if 'pdf-fidelity-v5.js' not in s:
              s = s.replace('</body>', js1 + js2 + '</body>')
          p.write_text(s, encoding='utf-8')
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable PDF fidelity editing and export"
          git push
