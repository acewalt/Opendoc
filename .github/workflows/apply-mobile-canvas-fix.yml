name: Apply mobile canvas fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-canvas-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes móviles al editor
        run: python .github/scripts/patch_mobile_canvas.py
      - name: Commit del ajuste móvil
        shell: bash
        run: |
          git config user.name "Waltiva CI"
          git config user.email "actions@users.noreply.github.com"
          git add public/web-apps/apps/documenteditor/main/loading.js
          git commit -m "Improve mobile document canvas and keyboard toolbar"
          git push
