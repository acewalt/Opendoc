name: Wire Waltiva Zoom V10
on:
  push:
    paths:
      - '.github/workflows/wire-zoom-v10.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect zoom V10
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='  <link rel="stylesheet" href="./zoom-spread-v10.css" />\n'
          js='  <script src="./zoom-spread-v10.js"></script>\n'
          if 'zoom-spread-v10.css' not in s:
              marker='  <link rel="stylesheet" href="./media-v8.css" />\n'
              s=s.replace(marker, marker+css)
          if 'zoom-spread-v10.js' not in s:
              marker='  <script src="./history-v9.js"></script>\n'
              s=s.replace(marker, marker+js)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable Word-like zoom and two-page spread"
          git push
