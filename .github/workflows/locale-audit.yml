name: Auditar claves faltantes de locales

on:
  push:
    paths:
      - '.github/workflows/locale-audit.yml'

permissions:
  contents: read

jobs:
  audit-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar fork con locale español de ONLYOFFICE 7.5.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.request

          WEBAPPS_COMMIT = '5238ddb434246a1542a6a04b6639d6b64a79befc'
          editors = ('documenteditor','spreadsheeteditor','presentationeditor')

          def download(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Waltiva-locale-audit'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read()

          for editor in editors:
              es = json.loads(download(f'https://raw.githubusercontent.com/ONLYOFFICE/web-apps/{WEBAPPS_COMMIT}/apps/{editor}/main/locale/es.json').decode('utf-8-sig'))
              Path(f'/tmp/{editor}-es.json').write_text(json.dumps(es, ensure_ascii=False), encoding='utf-8')
          PY

          node <<'JS'
          const fs = require('fs')

          function extractModuleObject(text, moduleName) {
            const marker = `define("${moduleName}",`
            let pos = text.indexOf(marker)
            if (pos < 0) throw new Error(`${moduleName}: módulo no encontrado`)
            pos = text.indexOf('{', pos + marker.length)
            const start = pos
            let depth = 0, quote = null, escape = false
            for (let i = start; i < text.length; i++) {
              const ch = text[i]
              if (quote) {
                if (escape) escape = false
                else if (ch === '\\') escape = true
                else if (ch === quote) quote = null
                continue
              }
              if (ch === '"' || ch === "'" || ch === '`') quote = ch
              else if (ch === '{') depth++
              else if (ch === '}') {
                depth--
                if (depth === 0) return Function(`"use strict"; return (${text.slice(start, i + 1)});`)()
              }
            }
            throw new Error(`${moduleName}: objeto sin cierre`)
          }

          let totalMissing = 0
          for (const editor of ['documenteditor','spreadsheeteditor','presentationeditor']) {
            const text = fs.readFileSync(`public/web-apps/apps/${editor}/main/app.js`, 'utf8')
            const zh = extractModuleObject(text, `${editor}/main/locale/zh.json`)
            const es = JSON.parse(fs.readFileSync(`/tmp/${editor}-es.json`, 'utf8'))
            const missing = Object.keys(zh).filter(k => !(k in es)).sort()
            const extra = Object.keys(es).filter(k => !(k in zh)).sort()
            const mismatch = Object.keys(zh).filter(k => k in es && (Array.isArray(zh[k]) !== Array.isArray(es[k]) || typeof zh[k] !== typeof es[k]))
            console.log(`\n===== ${editor} =====`)
            console.log(`fork=${Object.keys(zh).length} | es-7.5.1=${Object.keys(es).length} | faltantes=${missing.length} | extras=${extra.length} | tipos=${mismatch.length}`)
            if (missing.length) {
              console.log('--- Faltan en es 7.5.1 ---')
              for (const key of missing) console.log(`${key}\t${JSON.stringify(zh[key])}`)
            }
            totalMissing += missing.length
          }
          console.log(`\nTOTAL_FALTANTES=${totalMissing}`)
          JS
