name: Apply Waltiva library redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimalist library redesign
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('enhancements.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* WALTIVA_LIBRARY_REDESIGN_V2 */'
          if marker not in css_text:
              css_text += r'''

/* WALTIVA_LIBRARY_REDESIGN_V2 */
.library-view{
  position:relative;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 4%,rgba(221,231,255,.88),transparent 28%),
    radial-gradient(circle at 78% 8%,rgba(233,222,255,.76),transparent 32%),
    linear-gradient(180deg,#f7f9ff 0%,#fbfcff 34%,#f7f8fa 100%);
}
:root[data-theme="dark"] .library-view{
  background:
    radial-gradient(circle at 14% 4%,rgba(67,86,139,.24),transparent 30%),
    radial-gradient(circle at 78% 8%,rgba(95,68,128,.22),transparent 32%),
    linear-gradient(180deg,#15171c 0%,#17191e 44%,#141618 100%);
}
.library-header{
  max-width:1180px;
  border-bottom:0;
  padding:24px 22px 14px;
  background:transparent;
}
.library-header .brand-icon{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px);
  border-color:rgba(112,128,156,.18);
  box-shadow:0 8px 30px rgba(74,92,127,.08);
}
.library-header .chip{
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(14px);
  border-color:rgba(112,128,156,.16);
  box-shadow:0 8px 24px rgba(74,92,127,.05);
}
:root[data-theme="dark"] .library-header .chip,
:root[data-theme="dark"] .library-header .brand-icon{background:rgba(31,34,42,.72)}
.library-main{max-width:1180px;padding:24px 22px 120px}
.section-title-row{align-items:flex-start}
.section-title-row .eyebrow{font-size:10px;letter-spacing:.24em;color:#7d8797;margin-bottom:7px}
.section-title-row h2{font-size:clamp(30px,4vw,46px);letter-spacing:-.035em;font-weight:760;margin:0}
.library-actions{gap:10px}
.library-actions .button{
  background:rgba(255,255,255,.66);
  backdrop-filter:blur(14px);
  border-color:rgba(112,128,156,.16);
  border-radius:999px;
  padding:10px 15px;
  box-shadow:0 8px 24px rgba(74,92,127,.05);
}
.library-actions .button.primary.teal{
  background:linear-gradient(135deg,#65a7ff 0%,#8f7cff 48%,#c377f2 100%);
  border-color:transparent;
  box-shadow:0 10px 28px rgba(112,114,235,.22);
}
.document-grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  max-width:760px;
  gap:20px;
  margin-top:34px;
}
.document-card{border-radius:22px}
.doc-cover{
  height:auto;
  aspect-ratio:.82;
  border-radius:22px;
  border:1px solid rgba(112,128,156,.15);
  box-shadow:0 16px 40px rgba(72,89,125,.08);
  overflow:hidden;
  font-size:46px;
}
.document-card:hover .doc-cover{transform:translateY(-2px);box-shadow:0 20px 46px rgba(72,89,125,.12)}
.create-cover{
  border:1px solid rgba(98,132,196,.22);
  background:linear-gradient(145deg,#dbe9ff 0%,#d9e7ff 54%,#e8e3ff 100%);
  color:#2268c8;
}
.import-cover{
  border:1px solid rgba(133,114,197,.18);
  background:linear-gradient(145deg,#cfe2ff 0%,#d8e3ff 42%,#e8dfff 100%);
  color:#5b5ed5;
}
.document-card strong{font:720 16px/1.25 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin-top:12px}
.document-card span{font-size:11px;color:#7e8794}
:root[data-theme="dark"] .create-cover{background:linear-gradient(145deg,#26364f,#2d3556 55%,#3a3157);color:#91bfff}
:root[data-theme="dark"] .import-cover{background:linear-gradient(145deg,#26384f,#303956 45%,#40345b);color:#b3abff}

.file-source-module{
  margin-top:44px;
  padding:22px;
  border:1px solid rgba(112,128,156,.14);
  border-radius:26px;
  background:rgba(255,255,255,.64);
  backdrop-filter:blur(18px);
  box-shadow:0 18px 46px rgba(76,93,129,.06);
}
:root[data-theme="dark"] .file-source-module{background:rgba(30,32,38,.72);border-color:rgba(255,255,255,.08)}
.file-source-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}
.file-source-head h3{font-size:20px;margin:0;letter-spacing:-.02em}
.file-source-head p{margin:4px 0 0;color:var(--muted);font-size:11px}
.file-source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.file-source-card{
  min-height:126px;
  border:1px solid rgba(112,128,156,.14);
  border-radius:20px;
  background:linear-gradient(145deg,rgba(224,236,255,.88),rgba(235,228,255,.82));
  padding:18px;
  text-align:left;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:.18s ease;
}
.file-source-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(84,95,140,.10)}
.file-source-card.recent-choice{background:linear-gradient(145deg,rgba(229,239,255,.84),rgba(221,239,248,.86))}
.file-source-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.72);color:#3e64bd;font-size:18px;box-shadow:inset 0 0 0 1px rgba(83,104,153,.10)}
.file-source-card strong{font-size:14px;margin-top:15px}
.file-source-card small{color:#747e8c;font-size:10px;line-height:1.45;margin-top:4px}
:root[data-theme="dark"] .file-source-card{background:linear-gradient(145deg,rgba(49,63,88,.88),rgba(62,51,84,.86))}
:root[data-theme="dark"] .file-source-card.recent-choice{background:linear-gradient(145deg,rgba(45,61,83,.88),rgba(42,67,76,.86))}
:root[data-theme="dark"] .file-source-icon{background:rgba(255,255,255,.08);color:#a9c6ff}

.recent-files-section{
  margin-top:18px;
  padding:20px 22px;
  border-radius:24px;
  border:1px solid rgba(112,128,156,.12);
  background:rgba(255,255,255,.56);
  backdrop-filter:blur(16px);
}
:root[data-theme="dark"] .recent-files-section{background:rgba(30,32,38,.68);border-color:rgba(255,255,255,.07)}
.recent-files-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.recent-file-card{border-radius:16px;background:rgba(255,255,255,.7);border-color:rgba(112,128,156,.12)}
:root[data-theme="dark"] .recent-file-card{background:rgba(255,255,255,.045)}
.recent-file-icon{background:linear-gradient(145deg,#7aa8ff,#8c7cf1 56%,#bd75e6)}
.supported-card{
  margin-top:20px;
  border-radius:22px;
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(14px);
  border-color:rgba(112,128,156,.12);
  box-shadow:none;
}
:root[data-theme="dark"] .supported-card{background:rgba(31,33,39,.62);border-color:rgba(255,255,255,.07)}

.mobile-library-nav{display:none}
@media(max-width:850px){
  .library-header{padding:20px 20px 8px;min-height:72px}
  .library-main{padding:20px 20px 118px}
  .section-title-row{gap:18px}
  .section-title-row h2{font-size:34px}
  .library-actions{width:100%;overflow:auto;flex-wrap:nowrap;padding-bottom:2px}
  .library-actions .button{flex:0 0 auto}
  .document-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px}
  .doc-cover{aspect-ratio:.80;border-radius:18px;font-size:40px}
  .document-card strong{font-size:14px;margin-top:9px}
  .document-card span{font-size:10px;line-height:1.35}
  .file-source-module{margin-top:34px;padding:16px;border-radius:22px}
  .file-source-head{align-items:flex-start}
  .file-source-grid{gap:10px}
  .file-source-card{min-height:118px;border-radius:17px;padding:14px}
  .file-source-icon{width:34px;height:34px;border-radius:11px;font-size:16px}
  .file-source-card strong{font-size:13px;margin-top:12px}
  .file-source-card small{font-size:9px}
  .recent-files-section{padding:16px;border-radius:20px}
  .supported-card{border-radius:20px;padding:16px}
  .mobile-library-nav{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    position:fixed;
    left:50%;
    bottom:max(14px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:min(390px,calc(100% - 34px));
    height:68px;
    padding:7px;
    border:1px solid rgba(112,128,156,.15);
    border-radius:26px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(24px);
    box-shadow:0 18px 50px rgba(55,70,104,.18);
    z-index:80;
  }
  :root[data-theme="dark"] .mobile-library-nav{background:rgba(27,29,35,.88);border-color:rgba(255,255,255,.09)}
  .mobile-library-nav button{
    border:0;
    background:transparent;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:10px;
    color:var(--muted);
  }
  .mobile-library-nav button.active{background:linear-gradient(145deg,rgba(218,230,255,.9),rgba(232,225,255,.92));color:#3056a8;font-weight:750}
  :root[data-theme="dark"] .mobile-library-nav button.active{background:linear-gradient(145deg,#29364d,#3b3153);color:#b7caff}
  .mobile-library-nav .nav-icon{font-size:18px;line-height:1}
}
'''
              css.write_text(css_text, encoding='utf-8')

          js = Path('enhancements.js')
          js_text = js.read_text(encoding='utf-8')
          js_marker = '/* WALTIVA_LIBRARY_REDESIGN_V2 */'
          if js_marker not in js_text:
              js_text += r'''

/* WALTIVA_LIBRARY_REDESIGN_V2 */
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function buildLibraryRedesign(){
    const main = document.querySelector('.library-main');
    const grid = $('documentGrid');
    const recent = $('recentFilesSection');
    const supported = document.querySelector('.supported-card');
    const downloadsButton = $('downloadsFilesButton');
    if (!main || !grid || !supported || $('fileSourceModule')) return;

    const source = document.createElement('section');
    source.id = 'fileSourceModule';
    source.className = 'file-source-module';
    source.innerHTML = '<div class="file-source-head"><div><h3>Tus archivos</h3><p>Elige desde dónde quieres abrir un documento.</p></div></div><div class="file-source-grid"><button type="button" class="file-source-card downloads-choice" id="downloadsChoice"><span class="file-source-icon">⌄</span><span><strong>Descargas / Archivos</strong><small>Abre el selector del dispositivo o una carpeta autorizada.</small></span></button><button type="button" class="file-source-card recent-choice" id="recentChoice"><span class="file-source-icon">↺</span><span><strong>Recientes</strong><small>Vuelve a los documentos que ya abriste en Waltiva.</small></span></button></div>';

    if (recent) main.insertBefore(source, recent);
    else main.insertBefore(source, supported);

    if (downloadsButton){
      downloadsButton.style.display = 'none';
      $('downloadsChoice').addEventListener('click', function(){ downloadsButton.click(); });
    } else {
      $('downloadsChoice').addEventListener('click', function(){ const i=$('fileInputLibrary'); if(i) i.click(); });
    }

    $('recentChoice').addEventListener('click', function(){
      const section = $('recentFilesSection');
      if (section && !section.classList.contains('hidden')) section.scrollIntoView({behavior:'smooth',block:'start'});
      else {
        const i = $('fileInputLibrary');
        if (i) i.click();
      }
    });

    if (!$('mobileLibraryNav')){
      const nav = document.createElement('nav');
      nav.id = 'mobileLibraryNav';
      nav.className = 'mobile-library-nav';
      nav.innerHTML = '<button type="button" class="active" id="navHome"><span class="nav-icon">⌂</span><span>Inicio</span></button><button type="button" id="navCreate"><span class="nav-icon">＋</span><span>Crear</span></button><button type="button" id="navBrowse"><span class="nav-icon">⌕</span><span>Examinar</span></button>';
      document.querySelector('.library-view').appendChild(nav);
      $('navHome').addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });
      $('navCreate').addEventListener('click', function(){ const b=$('newDocument'); if(b) b.click(); });
      $('navBrowse').addEventListener('click', function(){ $('downloadsChoice').click(); });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', buildLibraryRedesign);
  else buildLibraryRedesign();
  setTimeout(buildLibraryRedesign, 100);
})();
'''
              js.write_text(js_text, encoding='utf-8')
          PY
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enhancements.css enhancements.js
          git rm .github/workflows/apply-library-redesign.yml
          git commit -m "Redesign Waltiva library with pastel cards and file sources"
          git push
