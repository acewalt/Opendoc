name: Apply mobile Word states

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-word-states.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar comportamiento móvil tipo Word
        run: python .github/scripts/patch_mobile_word_states.py
      - name: Validar sintaxis
        run: node --check public/web-apps/apps/documenteditor/main/loading.js
      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "Waltiva CI"
          git config user.email "actions@users.noreply.github.com"
          git add public/web-apps/apps/documenteditor/main/loading.js
          git commit -m "Match Word mobile reading and editing states"
          git push
