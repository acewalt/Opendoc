name: Diagnosticar selector de fuentes

on:
  push:
    paths:
      - '.github/workflows/diagnose-font-dropdown.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar fragmentos compilados de ComboBoxFonts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for editor in ('documenteditor','spreadsheeteditor','presentationeditor'):
              text=Path(f'public/web-apps/apps/{editor}/main/app.js').read_text(encoding='utf-8')
              print('\n===', editor, '===')
              for marker in ('fonts_thumbnail','createImageData','imgidx'):
                  pos=text.find(marker)
                  print('\nMARKER', marker, 'POS', pos)
                  if pos >= 0:
                      print(text[max(0,pos-700):pos+1200])
          PY
