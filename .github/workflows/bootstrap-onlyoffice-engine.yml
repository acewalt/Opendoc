name: Bootstrap ONLYOFFICE engine

on:
  push:
    branches:
      - onlyoffice-engine
    paths:
      - '.github/workflows/bootstrap-onlyoffice-engine.yml'

permissions:
  contents: write

jobs:
  import-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Waltiva branch
        uses: actions/checkout@v4
        with:
          ref: onlyoffice-engine
          fetch-depth: 0

      - name: Preserve bootstrap workflow
        run: cp .github/workflows/bootstrap-onlyoffice-engine.yml /tmp/bootstrap-onlyoffice-engine.yml

      - name: Fetch pinned ONLYOFFICE local source
        run: |
          git clone https://github.com/sweetwisdom/onlyoffice-web-local.git /tmp/onlyoffice-web-local
          cd /tmp/onlyoffice-web-local
          git checkout c4905016372a633cfba59a78f0acb3f029c85883
          rm -rf .git

      - name: Replace branch contents with upstream engine
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/onlyoffice-web-local/. .
          mkdir -p .github/workflows
          cp /tmp/bootstrap-onlyoffice-engine.yml .github/workflows/bootstrap-onlyoffice-engine.yml
          rm -f .github/workflows/deploy.yml .github/workflows/release.yml

      - name: Apply Waltiva metadata and attribution
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data['name'] = 'waltiva-onlyoffice-local'
          data['homepage'] = 'https://acewalt.github.io/Waltiva/'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          notice = '''# Waltiva — ONLYOFFICE local engine\n\nThis branch is based on `sweetwisdom/onlyoffice-web-local` at commit `c4905016372a633cfba59a78f0acb3f029c85883`.\n\nThe upstream project uses OnlyOffice WebSDK together with `x2t-wasm` to open, edit and export Office documents locally in the browser. Waltiva keeps the upstream GNU Affero General Public License v3 (AGPL-3.0) and this source remains publicly available under the same license where required.\n\nUpstream: https://github.com/sweetwisdom/onlyoffice-web-local\n\nWaltiva will customize branding, language, document library, PDF workflow and visual design on top of this engine.\n'''
          Path('NOTICE_WALTIVA.md').write_text(notice, encoding='utf-8')
          PY

      - name: Add Waltiva build verification workflow
        run: |
          cat > .github/workflows/build-onlyoffice.yml <<'YAML'
          name: Build Waltiva ONLYOFFICE engine

          on:
            push:
              branches: [onlyoffice-engine, main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 10
                    run_install: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - run: pnpm build
          YAML

      - name: Commit imported engine
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import ONLYOFFICE local engine as Waltiva foundation'
          git push origin onlyoffice-engine
