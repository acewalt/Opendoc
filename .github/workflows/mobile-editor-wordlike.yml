name: Apply Word-like mobile editor layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-editor-wordlike.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar editor móvil y teclado
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          loading = Path('public/web-apps/apps/documenteditor/main/loading.js')
          s = loading.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: se esperaba 1 coincidencia y se encontraron {count}')
              return text.replace(old, new, 1)

          old_css = """            'body.waltiva-mobile-ui #editor-container,body.waltiva-mobile-ui #editor_sdk{left:0!important;right:0!important;width:100%!important;max-width:none!important;background:#fff!important;}',
            'body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_hor_ruler,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vert_ruler,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vertical_scroll,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_horizontal_scroll,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vscrollbar,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_hscrollbar,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_buttonTabs{visibility:hidden!important;opacity:0!important;pointer-events:none!important;overflow:hidden!important;}',
            'body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_hor_ruler,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_horizontal_scroll,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_hscrollbar{height:0!important;min-height:0!important;max-height:0!important;}',
            'body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vert_ruler,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vertical_scroll,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vscrollbar,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_buttonTabs{width:0!important;min-width:0!important;max-width:0!important;}',
"""
          new_css = """            'body.waltiva-mobile-ui #editor-container,body.waltiva-mobile-ui #editor_sdk,body.waltiva-mobile-ui #id_main,body.waltiva-mobile-ui #id_viewer{left:0!important;right:0!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important;background:#fff!important;}',
            'body.waltiva-mobile-ui #editor_sdk canvas,body.waltiva-mobile-ui #id_viewer canvas{box-shadow:none!important;outline:0!important;}',
            'body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_hor_ruler,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vert_ruler,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vertical_scroll,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_horizontal_scroll,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vscrollbar,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_hscrollbar,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_buttonTabs{visibility:hidden!important;opacity:0!important;pointer-events:none!important;overflow:hidden!important;margin:0!important;padding:0!important;border:0!important;}',
            'body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_hor_ruler,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_horizontal_scroll,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_hscrollbar{height:0!important;min-height:0!important;max-height:0!important;top:auto!important;bottom:0!important;}',
            'body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vert_ruler,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vertical_scroll,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_vscrollbar,body.waltiva-mobile-ui:not(.waltiva-mobile-native-ribbon) #id_buttonTabs{width:0!important;min-width:0!important;max-width:0!important;left:auto!important;right:0!important;}',
"""
          s = replace_once(s, old_css, new_css, 'chrome móvil')

          old_format = """            '.wlt-mobile-formatbar{position:fixed;z-index:12000;left:50%;bottom:calc(10px + var(--wlt-keyboard-offset) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 28px);max-width:560px;height:58px;padding:0 8px;display:flex;align-items:center;justify-content:space-around;background:rgba(29,29,29,.97);color:#fff;border:1px solid rgba(255,255,255,.13);border-radius:30px;box-shadow:0 10px 35px rgba(0,0,0,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);will-change:bottom;}',
            'body.waltiva-mobile-view-mode .wlt-mobile-formatbar{display:none;}',
"""
          new_format = """            '.wlt-mobile-formatbar{position:fixed;z-index:12000;left:50%;bottom:calc(10px + var(--wlt-keyboard-offset) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 28px);max-width:560px;height:58px;padding:0 8px;display:flex;align-items:center;justify-content:space-around;background:rgba(29,29,29,.97);color:#fff;border:1px solid rgba(255,255,255,.13);border-radius:30px;box-shadow:0 10px 35px rgba(0,0,0,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);will-change:bottom;}',
            'body.waltiva-mobile-keyboard-open .wlt-mobile-formatbar{bottom:calc(8px + var(--wlt-keyboard-offset))!important;}',
            'body.waltiva-mobile-keyboard-open #viewport{bottom:calc(var(--wlt-mobile-bottom) + var(--wlt-keyboard-offset))!important;}',
            'body.waltiva-mobile-view-mode .wlt-mobile-formatbar{display:none;}',
"""
          s = replace_once(s, old_format, new_format, 'barra sobre teclado')

          old_viewport_fn = """    function updateVisualViewport(resetBase) {
        var vv = window.visualViewport
        if (!vv || !document.documentElement) return
        var visibleBottom = Math.max(0, Math.round(vv.height + vv.offsetTop))
        if (resetBase || !maxVisualViewportHeight || visibleBottom > maxVisualViewportHeight) {
            maxVisualViewportHeight = visibleBottom
        }
        var nextOffset = Math.max(0, maxVisualViewportHeight - visibleBottom)
        // Cambios pequeños suelen ser solo la barra de Safari; el teclado ocupa bastante más.
        if (nextOffset < 80) nextOffset = 0
        if (keyboardOffset === nextOffset) return
        keyboardOffset = nextOffset
        document.documentElement.style.setProperty('--wlt-keyboard-offset', keyboardOffset + 'px')
        if (document.body) document.body.classList.toggle('waltiva-mobile-keyboard-open', keyboardOffset > 0)
        setTimeout(resizeEditor, 20)
        setTimeout(function () { fitWidthWhenReady(0) }, 90)
    }

"""
          new_viewport_fn = """    function getHostWindow() {
        try {
            if (window.parent && window.parent !== window && window.parent.document) return window.parent
        } catch (e) {}
        return window
    }

    function getViewportSource() {
        var host = getHostWindow()
        return {
            host: host,
            viewport: host.visualViewport || window.visualViewport || null
        }
    }

    function measureKeyboardOffset(resetBase) {
        var source = getViewportSource()
        var host = source.host
        var vv = source.viewport
        if (!document.documentElement) return 0

        var nextOffset = 0
        if (vv) {
            var visibleBottom = Math.max(0, Math.round(vv.height + (vv.offsetTop || 0)))

            // Dentro del iframe usamos la parte realmente tapada del editor. Esto evita
            // mover dos veces la barra cuando Safari ya redujo el alto del iframe.
            if (host !== window && window.frameElement && window.frameElement.getBoundingClientRect) {
                try {
                    var frameRect = window.frameElement.getBoundingClientRect()
                    nextOffset = Math.max(0, Math.round(frameRect.bottom - visibleBottom))
                } catch (e) {}
            }

            // Fallback para navegadores donde el rectángulo del iframe ya viene recortado.
            if (!nextOffset) {
                if (resetBase || !maxVisualViewportHeight || visibleBottom > maxVisualViewportHeight) {
                    maxVisualViewportHeight = visibleBottom
                }
                nextOffset = Math.max(0, maxVisualViewportHeight - visibleBottom)
            }
        }

        // La barra inferior de Safari puede cambiar algunas decenas de px sin que haya teclado.
        if (nextOffset < 110) nextOffset = 0
        return nextOffset
    }

    function updateVisualViewport(resetBase) {
        var nextOffset = measureKeyboardOffset(!!resetBase)
        if (keyboardOffset === nextOffset) return
        keyboardOffset = nextOffset
        document.documentElement.style.setProperty('--wlt-keyboard-offset', keyboardOffset + 'px')
        if (document.body) document.body.classList.toggle('waltiva-mobile-keyboard-open', keyboardOffset > 0)
        setTimeout(resizeEditor, 20)
        setTimeout(function () { fitWidthWhenReady(0) }, 100)
    }

    function scheduleViewportSync() {
        var delays = [0, 60, 140, 260, 420, 700]
        for (var i = 0; i < delays.length; i++) {
            (function (delay) {
                setTimeout(function () { updateVisualViewport(false) }, delay)
            })(delays[i])
        }
    }

"""
          s = replace_once(s, old_viewport_fn, new_viewport_fn, 'detección de teclado')

          old_events = """        if (window.visualViewport) {
            var onVisualViewportChange = function () {
                updateVisualViewport(false)
                setTimeout(resizeEditor, 40)
            }
            window.visualViewport.addEventListener('resize', onVisualViewportChange)
            window.visualViewport.addEventListener('scroll', onVisualViewportChange)
        }
        window.addEventListener('resize', function () {
            updateVisualViewport(false)
            setTimeout(resizeEditor, 60)
        })
        window.addEventListener('orientationchange', function () {
            maxVisualViewportHeight = 0
            setTimeout(function () {
                updateVisualViewport(true)
                resizeEditor()
                fitWidthWhenReady(0)
            }, 220)
        })
"""
          new_events = """        var source = getViewportSource()
        var hostWindow = source.host
        var hostViewport = source.viewport
        var onVisualViewportChange = function () {
            updateVisualViewport(false)
            setTimeout(resizeEditor, 40)
        }

        if (hostViewport) {
            hostViewport.addEventListener('resize', onVisualViewportChange)
            hostViewport.addEventListener('scroll', onVisualViewportChange)
        }
        if (window.visualViewport && window.visualViewport !== hostViewport) {
            window.visualViewport.addEventListener('resize', onVisualViewportChange)
            window.visualViewport.addEventListener('scroll', onVisualViewportChange)
        }

        window.addEventListener('resize', function () {
            scheduleViewportSync()
            setTimeout(resizeEditor, 60)
        })
        if (hostWindow !== window) {
            try { hostWindow.addEventListener('resize', scheduleViewportSync) } catch (e) {}
        }

        document.addEventListener('focusin', scheduleViewportSync, true)
        document.addEventListener('focusout', scheduleViewportSync, true)

        window.addEventListener('orientationchange', function () {
            maxVisualViewportHeight = 0
            setTimeout(function () {
                updateVisualViewport(true)
                resizeEditor()
                fitWidthWhenReady(0)
            }, 220)
        })
"""
          s = replace_once(s, old_events, new_events, 'eventos de teclado')

          old_install = """        updateVisualViewport(true)

        var topbar = document.createElement('div')
"""
          new_install = """        updateVisualViewport(true)
        scheduleViewportSync()

        var topbar = document.createElement('div')
"""
          s = replace_once(s, old_install, new_install, 'sincronización inicial')

          loading.write_text(s, encoding='utf-8')

          vue = Path('src/components/DocumentHandler.vue')
          v = vue.read_text(encoding='utf-8')
          old_outer = """#iframe {
    flex: 1;
    min-height: 0;
    width: 100%;
}

.math-preview {
"""
          new_outer = """#iframe {
    flex: 1;
    min-height: 0;
    width: 100%;
}

@media (max-width: 760px) {
    .editor-container {
        height: 100dvh;
        width: 100vw;
        max-width: 100vw;
        background: #fff;
    }

    #iframe {
        width: 100vw;
        max-width: 100vw;
        overflow: hidden;
    }
}

.math-preview {
"""
          v = replace_once(v, old_outer, new_outer, 'contenedor móvil exterior')
          vue.write_text(v, encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "Waltiva CI"
          git config user.email "actions@users.noreply.github.com"
          git add public/web-apps/apps/documenteditor/main/loading.js src/components/DocumentHandler.vue
          git commit -m "Make mobile editor full-width and keep tools above keyboard"
          git push
