name: Validar editor móvil

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-math-view.yml'
      - '.github/scripts/test-mobile-editor.js'
      - 'src/components/DocumentHandler.vue'
      - 'public/web-apps/apps/documenteditor/main/loading.js'
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps webkit
      - name: Probar interfaz iPhone
        shell: bash
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/waltiva-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node .github/scripts/test-mobile-editor.js
