name: Validar Vista matemática

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-math-view.yml'
      - 'src/components/DocumentHandler.vue'
      - 'src/utils/mathView.ts'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Inspeccionar conversión matemática del modelo Word
        shell: bash
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/waltiva-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto('http://127.0.0.1:4173/#/', { waitUntil: 'networkidle' });
            await page.getByText('Crear documento', { exact: true }).click();
            await page.getByText('Documento', { exact: true }).click();
            await page.getByRole('switch', { name: /Vista matemática/i }).waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => document.querySelectorAll('iframe').length > 0, null, { timeout: 120000 });
            await page.waitForTimeout(8000);

            const diagnostics = await page.evaluate(() => {
              const frame = document.querySelector('iframe[name="frameEditor"]') || document.querySelector('iframe');
              const win = frame && frame.contentWindow;
              const api = win?.DE?.getController?.('Toolbar')?.api ||
                win?.DE?.getController?.('Main')?.api ||
                win?.DE?.getController?.('DocumentHolder')?.api ||
                win?.Asc?.editor || null;
              if (!win || !api) return { error: 'bridge unavailable' };

              const logic = typeof api.Gg === 'function' ? api.Gg() : null;
              if (!logic) return { error: 'logic document unavailable' };

              const inspect = (obj, names) => {
                const out = {};
                for (const name of names) {
                  try {
                    const fn = obj[name];
                    out[name] = typeof fn === 'function' ? {
                      length: fn.length,
                      source: Function.prototype.toString.call(fn).slice(0, 5000)
                    } : { value: fn };
                  } catch (e) {
                    out[name] = { error: String(e) };
                  }
                }
                return out;
              };

              const logicNames = new Set();
              let obj = logic;
              for (let depth = 0; obj && depth < 8; depth++, obj = Object.getPrototypeOf(obj)) {
                for (const name of Object.getOwnPropertyNames(obj)) logicNames.add(name);
              }
              const candidates = [...logicNames].filter(name => /TSd|v8e|I8e|fac|L0e|math|equat|convert|text|search|select/i.test(name)).sort();
              const keyMethods = inspect(logic, ['TSd','v8e','I8e','fac','L0e','xYd','rz','mq','Op','Ewb','ec']);

              return {
                logicType: logic.constructor?.name,
                candidates,
                keyMethods,
                apiSources: inspect(api, ['asc_ConvertEquationToMath','asc_ConvertMathView','asc_SetMathInputType','asc_AddText','asc_EditSelectAll','asc_GetSelectedText']),
                mathInputType: win.Asc?.c_oAscMathInputType,
                currentInputType: api.asc_GetMathInputType?.(),
              };
            });

            console.log('WORD_MATH_MODEL=' + JSON.stringify(diagnostics, null, 2));
            assert.ok(!diagnostics.error);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
