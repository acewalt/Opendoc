name: Validar Vista matemática

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-math-view.yml'
      - 'src/components/DocumentHandler.vue'
      - 'src/utils/mathView.ts'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Probar inserción LaTeX como ecuación nativa
        shell: bash
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/waltiva-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto('http://127.0.0.1:4173/#/', { waitUntil: 'networkidle' });
            await page.getByText('Crear documento', { exact: true }).click();
            await page.getByText('Documento', { exact: true }).click();
            await page.getByRole('switch', { name: /Vista matemática/i }).waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => document.querySelectorAll('iframe').length > 0, null, { timeout: 120000 });
            await page.waitForTimeout(8000);

            const result = await page.evaluate(async () => {
              const frame = document.querySelector('iframe[name="frameEditor"]') || document.querySelector('iframe');
              const win = frame && frame.contentWindow;
              const api = win?.DE?.getController?.('Toolbar')?.api || win?.Asc?.editor || null;
              if (!win || !api) return { error: 'bridge unavailable' };

              const fnSource = {};
              for (const name of ['asc_AddMath','asc_AddMath2','asc_AddText','Add_Text','pluginMethod_InputText','pluginMethod_PasteText']) {
                try {
                  fnSource[name] = typeof api[name] === 'function' ? Function.prototype.toString.call(api[name]).slice(0, 3000) : null;
                } catch (e) { fnSource[name] = String(e); }
              }

              const describeSelection = () => {
                const out = [];
                try {
                  const selected = api.getSelectedElements?.() || [];
                  for (const item of selected) {
                    out.push({ type: item.get_ObjectType?.(), ctor: item.get_ObjectValue?.()?.constructor?.name || null });
                  }
                } catch (e) { out.push({ error: String(e) }); }
                return out;
              };

              const attempts = [];
              const latex = '\\frac{x^2+1}{\\sqrt{y}}';
              const oldType = api.asc_GetMathInputType?.();
              api.asc_SetMathInputType?.(win.Asc.c_oAscMathInputType.LaTeX);

              const runAttempt = async (label, action) => {
                try {
                  api.asc_EditSelectAll?.();
                  if ((api.asc_GetSelectedText?.() || '').length) api.asc_Remove?.(-1, true, false, false, false);
                  api.asc_RemoveSelection?.();
                  await new Promise(r => setTimeout(r, 250));
                  const before = describeSelection();
                  const value = action();
                  await new Promise(r => setTimeout(r, 700));
                  const afterInsert = describeSelection();
                  let convertResult = null;
                  let convertError = null;
                  try { convertResult = api.asc_ConvertMathView?.(false, false); } catch (e) { convertError = String(e); }
                  await new Promise(r => setTimeout(r, 400));
                  const afterConvert = describeSelection();
                  const selectedText = api.asc_GetSelectedText?.();
                  attempts.push({ label, valueType: typeof value, before, afterInsert, afterConvert, selectedText, convertResult, convertError, inline: api.asc_IsInlineMath?.() });
                } catch (e) {
                  attempts.push({ label, error: String(e), stack: e?.stack });
                } finally {
                  try { api.Undo?.(); api.Undo?.(); api.Undo?.(); api.asc_RemoveSelection?.(); } catch {}
                  await new Promise(r => setTimeout(r, 300));
                }
              };

              await runAttempt('AddMath2-string', () => api.asc_AddMath2?.(latex));
              await runAttempt('AddMath-undefined-then-text', () => { api.asc_AddMath?.(); return api.asc_AddText?.(latex); });
              await runAttempt('AddMath2-undefined-then-text', () => { api.asc_AddMath2?.(); return api.asc_AddText?.(latex); });
              await runAttempt('AddMath-fraction-template-then-text', () => { api.asc_AddMath?.(16777216); return api.asc_AddText?.(latex); });

              api.asc_SetMathInputType?.(oldType);
              return { fnSource, attempts, mathType: win.Asc.c_oAscTypeSelectElement?.Math };
            });

            console.log('NATIVE_INSERT_RESULT=' + JSON.stringify(result, null, 2));
            assert.ok(!result.error);
            const successful = result.attempts.find(a => !a.error && [...(a.afterInsert || []), ...(a.afterConvert || [])].some(x => x.type === result.mathType));
            assert.ok(successful, 'Ningún intento creó un objeto Math nativo');
            console.log('SUCCESSFUL_NATIVE_PATH=' + successful.label);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
