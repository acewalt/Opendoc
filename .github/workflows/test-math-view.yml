name: Diagnosticar ribbon y móvil

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-math-view.yml'
      - 'src/components/DocumentHandler.vue'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Inspeccionar pestaña Diseño y carga tipo iPhone
        shell: bash
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/waltiva-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node <<'NODE'
          const { chromium, webkit, devices } = require('@playwright/test');

          async function openDocument(page) {
            await page.goto('http://127.0.0.1:4173/#/', { waitUntil: 'networkidle' });
            await page.getByText('Crear documento', { exact: true }).click();
            await page.getByText('Documento', { exact: true }).click();
            await page.waitForFunction(() => document.querySelectorAll('iframe').length > 0, null, { timeout: 120000 });
          }

          (async () => {
            {
              const browser = await chromium.launch({ headless: true });
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              await openDocument(page);
              await page.waitForTimeout(8000);
              const ribbon = await page.evaluate(() => {
                const frame = document.querySelector('iframe[name="frameEditor"]') || document.querySelector('iframe');
                const doc = frame?.contentDocument;
                if (!doc) return { error: 'no iframe document' };
                const clean = (el) => ({
                  tag: el.tagName,
                  id: el.id || '',
                  cls: typeof el.className === 'string' ? el.className : '',
                  role: el.getAttribute('role'),
                  dataValue: el.getAttribute('data-value'),
                  text: (el.textContent || '').trim().slice(0, 120),
                });
                const exact = [...doc.querySelectorAll('*')].filter(el => (el.textContent || '').trim() === 'Diseño');
                return {
                  frameUrl: frame?.src,
                  matches: exact.slice(0, 10).map(el => ({
                    self: clean(el),
                    parent: el.parentElement ? clean(el.parentElement) : null,
                    grand: el.parentElement?.parentElement ? clean(el.parentElement.parentElement) : null,
                    great: el.parentElement?.parentElement?.parentElement ? clean(el.parentElement.parentElement.parentElement) : null,
                  })),
                };
              });
              console.log('DESIGN_RIBBON=' + JSON.stringify(ribbon, null, 2));
              await browser.close();
            }

            {
              const browser = await webkit.launch({ headless: true });
              const context = await browser.newContext({ ...devices['iPhone 13'] });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', msg => {
                if (msg.type() === 'error' || msg.type() === 'warning') consoleErrors.push(msg.type() + ': ' + msg.text());
              });
              page.on('pageerror', err => pageErrors.push(String(err)));
              await openDocument(page);
              await page.waitForTimeout(30000);
              const mobile = await page.evaluate(() => {
                const frame = document.querySelector('iframe[name="frameEditor"]') || document.querySelector('iframe');
                const win = frame?.contentWindow;
                const doc = frame?.contentDocument;
                const api = win?.DE?.getController?.('Toolbar')?.api || win?.DE?.getController?.('Main')?.api || win?.Asc?.editor || null;
                const bodyText = (doc?.body?.innerText || '').replace(/\s+/g, ' ').slice(0, 1000);
                const apiFlags = {};
                if (api) {
                  for (const key of ['isDocumentLoadComplete','isDocumentLoaded','DocumentLoadComplete','bInit_word_control','isLoadFullApi']) {
                    try { apiFlags[key] = typeof api[key] === 'function' ? api[key]() : api[key]; } catch (e) { apiFlags[key] = String(e); }
                  }
                }
                return {
                  frameUrl: frame?.src || '',
                  bodyText,
                  hasLoadingText: bodyText.includes('Cargando documento'),
                  hasApi: !!api,
                  apiFlags,
                  innerWidth: win?.innerWidth,
                  userAgent: win?.navigator?.userAgent,
                };
              });
              console.log('IPHONE_WEBKIT=' + JSON.stringify({ mobile, consoleErrors, pageErrors }, null, 2));
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
