name: Validar Vista matemática

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-math-view.yml'
      - 'src/components/DocumentHandler.vue'
      - 'src/utils/mathView.ts'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Inspeccionar API matemática nativa en runtime
        shell: bash
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/waltiva-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto('http://127.0.0.1:4173/#/', { waitUntil: 'networkidle' });
            await page.getByText('Crear documento', { exact: true }).click();
            await page.getByText('Documento', { exact: true }).click();
            const toggle = page.getByRole('switch', { name: /Vista matemática/i });
            await toggle.waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => document.querySelectorAll('iframe').length > 0, null, { timeout: 120000 });
            await page.waitForTimeout(8000);

            const diagnostics = await page.evaluate(() => {
              const frame = document.querySelector('iframe[name="frameEditor"]') || document.querySelector('iframe');
              const win = frame && frame.contentWindow;
              const api = win?.DE?.getController?.('Toolbar')?.api ||
                win?.DE?.getController?.('Main')?.api ||
                win?.DE?.getController?.('DocumentHolder')?.api ||
                win?.Asc?.editor || null;
              if (!win || !api) return { error: 'bridge unavailable' };

              const names = [
                'asc_AddMath', 'asc_AddMath2', 'asc_ConvertEquationToMath', 'asc_ConvertMathView',
                'asc_SetMathInputType', 'asc_GetMathInputType', 'asc_IsInlineMath', 'asc_GetSelectionBounds',
                'asc_AddText', 'Add_Text', 'pluginMethod_InputText', 'pluginMethod_PasteText',
                'asc_findText', 'asc_SelectSearchElement', 'asc_RemoveSelection', 'Undo', 'Redo'
              ];
              const functions = {};
              for (const name of names) {
                try {
                  const fn = api[name];
                  functions[name] = typeof fn === 'function' ? {
                    length: fn.length,
                    source: Function.prototype.toString.call(fn).slice(0, 1800)
                  } : null;
                } catch (e) {
                  functions[name] = { error: String(e) };
                }
              }

              const enumToPlain = (obj) => {
                if (!obj) return null;
                const out = {};
                for (const key of Object.keys(obj)) {
                  const value = obj[key];
                  if (['string','number','boolean'].includes(typeof value)) out[key] = value;
                }
                return out;
              };

              const ascMath = {};
              for (const key of Object.keys(win.Asc || {}).filter(k => /Math/i.test(k))) {
                ascMath[key] = enumToPlain(win.Asc[key]) ?? typeof win.Asc[key];
              }
              const ascMathGlobal = win.AscMath ? Object.keys(win.AscMath).slice(0, 200) : [];

              const wc = api.WordControl || api.WordControl?.m_oLogicDocument ? api.WordControl : null;
              const logic = api.WordControl?.m_oLogicDocument || api.WordControl?.m_oLogicDocument || null;
              const logicMethods = logic ? (() => {
                const set = new Set();
                let o = logic;
                for (let d=0; o && d<6; d++, o=Object.getPrototypeOf(o)) {
                  for (const k of Object.getOwnPropertyNames(o)) if (/math|equat|text|select|search|remove|add/i.test(k)) set.add(k);
                }
                return [...set].sort().slice(0, 250);
              })() : [];

              return { functions, ascMath, ascMathGlobal, hasWordControl: !!wc, hasLogic: !!logic, logicMethods };
            });

            console.log('MATH_SIGNATURES=' + JSON.stringify(diagnostics, null, 2));
            assert.ok(!diagnostics.error);
            assert.ok(diagnostics.functions.asc_ConvertEquationToMath);
            assert.ok(diagnostics.functions.asc_ConvertMathView);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
