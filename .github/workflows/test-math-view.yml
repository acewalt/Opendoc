name: Validar ribbon y Safari

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-math-view.yml'
      - 'src/components/DocumentHandler.vue'
      - 'public/web-apps/apps/documenteditor/main/loading.js'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Validar Diseño y carga en WebKit
        shell: bash
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/waltiva-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node <<'NODE'
          const { chromium, webkit, devices } = require('@playwright/test');
          const assert = require('node:assert/strict');

          async function openDocument(page) {
            await page.goto('http://127.0.0.1:4173/#/', { waitUntil: 'networkidle' });
            await page.getByText('Crear documento', { exact: true }).click();
            await page.getByText('Documento', { exact: true }).click();
            await page.waitForFunction(() => document.querySelector('iframe[name="frameEditor"]'), null, { timeout: 120000 });
          }

          (async () => {
            {
              const browser = await chromium.launch({ headless: true });
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              await openDocument(page);
              await page.waitForTimeout(8000);
              const design = await page.evaluate(() => {
                const frame = document.querySelector('iframe[name="frameEditor"]');
                const doc = frame?.contentDocument;
                if (!doc) return { error: 'no frame doc' };
                const tab = [...doc.querySelectorAll('li.ribtab')].find(el => (el.textContent || '').trim() === 'Diseño');
                tab?.querySelector('a')?.click();
                const isVisible = el => {
                  const cs = getComputedStyle(el), r = el.getBoundingClientRect();
                  return cs.display !== 'none' && cs.visibility !== 'hidden' && r.width > 0 && r.height > 0;
                };
                const candidates = [...doc.querySelectorAll('.toolbar [id], .toolbar [class], #viewport [id]')]
                  .filter(isVisible)
                  .map(el => ({ tag: el.tagName, id: el.id || '', cls: typeof el.className === 'string' ? el.className : '', text: (el.textContent || '').trim().replace(/\s+/g,' ').slice(0,100) }))
                  .filter(x => /design|layout|theme|color|water|page|toolbar|tab/i.test(`${x.id} ${x.cls} ${x.text}`))
                  .slice(0,120);
                return { tabFound: !!tab, candidates };
              });
              console.log('DESIGN_CONTENT=' + JSON.stringify(design, null, 2));
              assert.ok(design.tabFound);
              await browser.close();
            }

            {
              const browser = await webkit.launch({ headless: true });
              const context = await browser.newContext({ ...devices['iPhone 13'] });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', err => pageErrors.push(String(err)));
              await openDocument(page);
              await page.waitForTimeout(30000);
              const state = await page.evaluate(() => {
                const frame = document.querySelector('iframe[name="frameEditor"]');
                const doc = frame?.contentDocument;
                const text = (doc?.body?.innerText || '').replace(/\s+/g, ' ');
                return { text: text.slice(0,800), loading: text.includes('Cargando documento'), hasCanvas: !!doc?.querySelector('canvas') };
              });
              console.log('IPHONE_WEBKIT=' + JSON.stringify({ state, pageErrors }, null, 2));
              assert.ok(!pageErrors.some(x => x.includes('requestIdleCallback')), 'requestIdleCallback sigue fallando');
              assert.equal(state.loading, false, 'ONLYOFFICE sigue atascado en Cargando documento');
              assert.ok(state.hasCanvas, 'No se creó el canvas del documento');
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
