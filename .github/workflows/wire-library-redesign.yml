name: Wire Waltiva library redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add redesign assets to index
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('<link rel=\"stylesheet\" href=\"./enhancements.css\" />','<link rel=\"stylesheet\" href=\"./enhancements.css\" />\\n  <link rel=\"stylesheet\" href=\"./library-redesign.css\" />'); s=s.replace('<script src=\"./enhancements.js\"></script>','<script src=\"./enhancements.js\"></script>\\n  <script src=\"./library-redesign.js\"></script>'); p.write_text(s,encoding='utf-8')"
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/wire-library-redesign.yml
          git commit -m "Enable minimalist Waltiva library redesign"
          git push
