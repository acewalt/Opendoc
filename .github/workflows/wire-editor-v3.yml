name: Wire Waltiva editor V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect editor redesign assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if './editor-redesign.css' not in s:
              s = s.replace('<link rel="stylesheet" href="./library-redesign.css" />', '<link rel="stylesheet" href="./library-redesign.css" />\n  <link rel="stylesheet" href="./editor-redesign.css" />')
          if './editor-redesign.js' not in s:
              s = s.replace('<script src="./library-redesign.js"></script>', '<script src="./library-redesign.js"></script>\n  <script src="./editor-redesign.js"></script>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-editor-v3.yml
          git add index.html
          git commit -m "Enable minimalist Word-style Waltiva editor"
          git push
