name: Apply Waltiva branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename product branding
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('OPENDOC', 'WALTIVA').replace('Opendoc', 'Waltiva')
          s = s.replace('<div class="welcome-logo"><span>O</span></div>', '<div class="welcome-logo"><span>W</span></div>')
          s = s.replace('<div class="brand-icon">O</div>', '<div class="brand-icon">W</div>')
          s = s.replace('<div class="brand compact"><div class="brand-icon small">O</div><strong>Waltiva</strong></div>', '<div class="brand compact"><div class="brand-icon small">W</div><strong>Waltiva</strong></div>')
          index.write_text(s, encoding='utf-8')

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')
          s = s.replace('Opendoc', 'Waltiva').replace('opendoc-theme', 'waltiva-theme')
          app.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8')
          s = s.replace('Opendoc', 'Waltiva')
          s = s.replace('https://acewalt.github.io/Waltiva/', 'https://acewalt.github.io/Opendoc/')
          readme.write_text(s, encoding='utf-8')
          PY
      - name: Commit branding changes
        run: |
          if git diff --quiet; then
            echo "No branding changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js README.md
          git commit -m "Rename product branding to Waltiva"
          git push
