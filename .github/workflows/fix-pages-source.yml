name: Corregir fuente de GitHub Pages

on:
  push:
    paths:
      - '.github/workflows/fix-pages-source.yml'

permissions:
  contents: read
  pages: write

jobs:
  fix-pages-source:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Pages para servir gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_code=$(curl -sS -o /tmp/pages-response.json -w '%{http_code}' \
            -L -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}')

          cat /tmp/pages-response.json || true
          echo "HTTP ${response_code}"
          if [ "${response_code}" != "204" ] && [ "${response_code}" != "200" ]; then
            exit 1
          fi

      - name: Verificar configuración
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
